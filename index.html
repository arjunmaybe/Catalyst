<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalyst</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage">
      <!-- Faint guide track + rotating sweep beam, shown with the ring -->
      <div id="guide-ring" hidden><div id="guide-beam"></div></div>

      <!-- Format picker nodes, hidden until a file is dragged over -->
      <div class="node" id="node-0" hidden><span class="node-label"></span></div>
      <div class="node" id="node-1" hidden><span class="node-label"></span></div>
      <div class="node" id="node-2" hidden><span class="node-label"></span></div>
      <div class="node" id="node-3" hidden><span class="node-label"></span></div>

      <!-- Nucleus: the main drop target, always visible -->
      <div id="nucleus"><span id="nucleus-icon" class="nucleus-icon" hidden></span><span id="status">drop file</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
